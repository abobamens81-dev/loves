
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Книга для тебя</title>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background-color: #1a0f14;
    background-image: radial-gradient(circle at center, #3a1c2a 0%, #0d0709 100%);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  .floating-hearts {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .heart-bg {
    position: absolute; bottom: -50px; color: rgba(255, 123, 156, 0.15);
    animation: floatUp 12s linear infinite;
  }
  .heart-bg:nth-child(1) { left: 10%; animation-duration: 8s; animation-delay: 0s; font-size: 2rem; }
  .heart-bg:nth-child(2) { left: 30%; animation-duration: 14s; animation-delay: 2s; font-size: 1.5rem; }
  .heart-bg:nth-child(3) { left: 55%; animation-duration: 10s; animation-delay: 4s; font-size: 2.5rem; }
  .heart-bg:nth-child(4) { left: 75%; animation-duration: 12s; animation-delay: 1s; font-size: 1.8rem; }
  .heart-bg:nth-child(5) { left: 90%; animation-duration: 11s; animation-delay: 5s; font-size: 2rem; }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  #cover {
    position: absolute;
    cursor: pointer;
    width: 300px;
    height: 440px;
    background: #4a1c2a;
    background-image: url('https://www.transparenttextures.com/patterns/dark-leather.png');
    border-radius: 8px 16px 16px 8px;
    box-shadow: 20px 20px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
    z-index: 20;
    border-left: 12px solid #2a0d14;
  }
  #cover:hover { transform: scale(1.02); }
  #cover.hide { transform: translateX(-150%) rotateY(-30deg); opacity: 0; pointer-events: none; }
  
  #cover h1 {
    font-family: 'Marck Script', cursive;
    color: #f7c8d8;
    font-size: 2.8rem;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    margin-bottom: 20px;
    text-align: center;
    line-height: 1.2;
  }
  .cover-heart {
    font-size: 4rem;
    color: #e91e63;
    animation: beat 1.5s infinite;
    filter: drop-shadow(0 5px 20px rgba(233,30,99,0.8));
  }

  #book {
    position: relative;
    display: none;
    width: 90vw;
    max-width: 800px;
    height: 75vh;
    max-height: 500px;
    opacity: 0;
    transition: opacity 0.8s ease;
    z-index: 10;
  }
  #book.show { display: flex; opacity: 1; }

  .book-spread {
    display: flex;
    width: 100%;
    height: 100%;
    box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    border-radius: 8px;
    position: relative;
    background-color: #f7e6eb;
  }

  .page {
    width: 50%;
    height: 100%;
    background-color: #f7e6eb;
    background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .page.left {
    border-radius: 8px 0 0 8px;
    border-right: 1px solid #e5cdd4;
  }
  .page.right {
    border-radius: 0 8px 8px 0;
  }

  .fade-out { opacity: 0; transform: scale(0.95); }
  .fade-in { opacity: 1; transform: scale(1); }

  .page-text {
    font-family: 'Marck Script', cursive;
    font-size: 1.4rem;
    color: #5a2a36;
    line-height: 1.3;
    margin-bottom: 15px;
    word-wrap: break-word;
  }

  .poem-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    color: #5a2a36;
    line-height: 1.4;
    margin-bottom: 5px;
    text-align: left;
  }

  .photo-frame {
    background: #fff;
    padding: 6px 6px 25px 6px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    transform: rotate(-2deg);
    width: 85%;
    max-width: 200px;
  }
  .photo-frame img {
    width: 100%;
    height: auto;
    max-height: 160px;
    object-fit: cover;
    display: block;
    filter: sepia(0.1) contrast(0.95);
  }

  .big-heart {
    font-size: 2.5rem;
    color: #e91e63;
    animation: beat 1.5s infinite;
    filter: drop-shadow(0 5px 15px rgba(233,30,99,0.3));
  }

  .nav-buttons {
    position: absolute;
    bottom: -50px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    z-index: 20;
  }
  .nav-btn {
    background: rgba(74, 28, 42, 0.9);
    color: #f7c8d8;
    border: 1px solid #f7c8d8;
    padding: 8px 20px;
    border-radius: 30px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .nav-btn:hover { background: #7a132e; color: #fff; transform: translateY(-2px); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  @media (max-width: 700px) {
    #cover { width: 85vw; height: 60vh; }
    #cover h1 { font-size: 2.2rem; }
    #book { width: 95vw; height: 70vh; max-height: 70vh; }
    .book-spread { flex-direction: column; }
    .page { width: 100%; height: 50%; padding: 10px; }
    .page.left { border-radius: 8px 8px 0 0; border-bottom: 1px solid #e5cdd4; border-right: none; justify-content: flex-end; padding-bottom: 15px; }
    .page.right { border-radius: 0 0 8px 8px; justify-content: flex-start; padding-top: 15px; }
    .page-text { font-size: 1.2rem; margin-bottom: 5px; }
    .poem-text { font-size: 0.9rem; text-align: center; }
    .big-heart { font-size: 2rem; }
    .photo-frame { max-width: 130px; max-height: 110px; padding: 4px 4px 15px 4px; }
    .nav-buttons { bottom: -45px; }
    .nav-btn { padding: 8px 18px; font-size: 0.95rem; }
  }
</style>
</head>
<body>

  <div class="floating-hearts">
    <div class="heart-bg">❤️</div>
    <div class="heart-bg">💖</div>
    <div class="heart-bg">💕</div>
    <div class="heart-bg">💘</div>
    <div class="heart-bg">🌸</div>
  </div>

  <div id="cover" onclick="openBook()">
    <h1>Моей<br>любимой</h1>
    <div class="cover-heart">❤️</div>
  </div>

  <div id="book">
    <div class="book-spread">
      <div class="page left" id="pageLeft"></div>
      <div class="page right" id="pageRight"></div>
    </div>
    
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>Назад</button>
      <button class="nav-btn" id="nextBtn" onclick="changePage(1)">Далее</button>
    </div>
  </div>

<script>
  const pagesData = [
    { left: "Больше всего на свете я люблю тебя.", right: "<div class='photo-frame'><img src='1.jpg' alt='Фото'></div>", heart: "❤️" },
    { left: "Если бы не твое доброе утро, мне и вставать не захотелось бы.", right: "<div class='photo-frame'><img src='2.jpg' alt='Фото'></div>", heart: "💖" },
    { left: "Если бы не твоя любовь, и жить бы не хотелось.", right: "<div class='photo-frame'><img src='3.jpg' alt='Фото'></div>", heart: "💕" },
    { left: "Если бы не твой смех, я бы не чувствовал, что люблю жить.", right: "<div class='photo-frame'><img src='4.jpg' alt='Фото'></div>", heart: "💘" },
    { left: "Я тебя так сильно люблю, любимая. Так сильно, что и передать не могу.", right: "<div class='photo-frame'><img src='5.jpg' alt='Фото'></div>", heart: "❤️" },
    { left: "Ты — мой самый родной человек.", right: "<div class='big-heart'>💖</div>", heart: "💖" },
    { left: "Твоя красота меня так манит... Чувство, что я утопаю в слезах радости.", right: "<div class='photo-frame'><img src='6.jpg' alt='Фото'></div>", heart: "✨" },
    { left: "Спасибо тебе за каждый день. За твое тепло.", right: "<div class='big-heart'>❤️</div>", heart: "❤️" },
    { left: "Ты — самое лучшее, что случилось в моей жизни.", right: "<div class='big-heart'>💕</div>", heart: "💕" },
    { left: "Ты — мое самое большое счастье. Я люблю тебя.", right: "<div class='big-heart'>💘</div>", heart: "💘" },
    { 
      left: "<div class='poem-text'>В твоих глазах я нахожу рассвет,<br>В твоей улыбке — теплое дыханье.<br>Тебя роднее в этом мире нет,<br>Ты — мое самое заветное желанье.</div>", 
      right: "<div class='poem-text'>Я по крупицам собирал мечты,<br>Чтоб подарить тебе свою вселенную.<br>И если рядом, в этой жизни, ты —<br>То я нашел дорогу драгоценную.<br><br>Пусть за окном бушуют холода,<br>Пусть время мчится, не сбавляя шаг.<br>Ты будешь мною любима всегда,<br>Ведь без тебя я просто не могу никак.</div>", 
      heart: "💖" 
    },
    { left: "Я хочу, чтобы мы вместе работали над нашим счастьем. Каждый день. Всю жизнь.", right: "<div class='photo-frame'><img src='7.jpg' alt='Фото'></div>", heart: "❤️" },
    // НОВАЯ 13-я СТРАНИЦА
    { left: "Я искренне боюсь потерять тебя. Я тебя так сильно люблю.", right: "<div class='big-heart'>❤️</div>", heart: "❤️" }
  ];

  let currentPage = 0;
  const totalPages = pagesData.length;
  const pageLeft = document.getElementById('pageLeft');
  const pageRight = document.getElementById('pageRight');

  function openBook() {
    document.getElementById('cover').classList.add('hide');
    setTimeout(() => {
      document.getElementById('book').classList.add('show');
      renderPage(true);
    }, 400);
  }

  function renderPage(instant = false) {
    const data = pagesData[currentPage];
    
    if (instant) {
      pageLeft.innerHTML = `<div class="page-text">${data.left}</div><div class="big-heart">${data.heart}</div>`;
      pageRight.innerHTML = data.right;
    } else {
      pageLeft.classList.add('fade-out');
      pageRight.classList.add('fade-out');
      
      setTimeout(() => {
        pageLeft.innerHTML = `<div class="page-text">${data.left}</div><div class="big-heart">${data.heart}</div>`;
        pageRight.innerHTML = data.right;
        
        pageLeft.classList.remove('fade-out');
        pageRight.classList.remove('fade-out');
        pageLeft.classList.add('fade-in');
        pageRight.classList.add('fade-in');
      }, 300);
    }

    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage === totalPages - 1;
  }

  function changePage(direction) {
    if (currentPage + direction < 0 || currentPage + direction >= totalPages) return;

    const spread = document.querySelector('.book-spread');
    spread.style.transform = direction === 1 ? 'rotateY(-5deg)' : 'rotateY(5deg)';
    spread.style.transition = 'transform 0.3s ease';
    
    setTimeout(() => {
      spread.style.transform = 'rotateY(0deg)';
    }, 300);

    currentPage += direction;
    renderPage();
  }
</script>
</body>
</html>
